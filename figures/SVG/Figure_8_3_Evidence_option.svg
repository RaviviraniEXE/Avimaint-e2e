<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="126.413mm" viewBox="0 0 605 478" role="img" aria-label="Figure 8.3 Anatomy of a displayed evidence option"><rect x="0" y="0" width="605" height="478" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">What a displayed historical option shows the reviewer</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Schematic of the evidence contract. Every field shown is traceable to one source record.</text><rect x="20.0" y="82.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="82.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="100.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Action family and pattern</text><text x="210.0" y="100.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Replace  ·  rocker cover gasket  ·  leak</text><text x="571.0" y="118.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Derived grouping, not an instruction</text><rect x="20.0" y="132.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="132.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="150.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Distinct cluster support</text><text x="210.0" y="150.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Supported by 14 distinct evidence clusters</text><text x="571.0" y="168.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Repeated records count once</text><rect x="20.0" y="182.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="182.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="200.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Outcome state</text><text x="210.0" y="200.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Positive 9  ·  unknown 5  ·  negative 0</text><text x="571.0" y="218.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Negative and mixed stay visible, never promoted</text><rect x="20.0" y="232.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="232.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="250.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Calibrated agreement</text><text x="210.0" y="250.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">0.94 historical-agreement probability</text><text x="571.0" y="268.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Agreement with the record, not correctness</text><rect x="20.0" y="282.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="282.0" width="5.0" height="42.0" rx="2.0" fill="#1baf7a"/><text x="34.0" y="300.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Evidence tier</text><text x="210.0" y="300.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Rung C: same component and fault anchors</text><text x="571.0" y="318.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Tier is shown, never hidden</text><rect x="20.0" y="332.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="332.0" width="5.0" height="42.0" rx="2.0" fill="#1baf7a"/><text x="34.0" y="350.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Provenance</text><text x="210.0" y="350.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">IDENT 100005 and 13 further record IDs</text><text x="571.0" y="368.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Original and normalized text both inspectable</text><line x1="20.0" y1="435.0" x2="585.0" y2="435.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="451.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">The interface presents alternatives with their evidence and uncertainty. It does not</text><text x="20.0" y="468.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">generate a procedure, and it never displays an action without the records that support it.</text></svg>