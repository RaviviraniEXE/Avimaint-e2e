<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="138.579mm" viewBox="0 0 605 524" role="img" aria-label="Figure 1.1 Thesis structure and evidence flow"><rect x="0" y="0" width="605" height="524" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">How the chapters build one bounded planning-support claim</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Each experimental chapter carries its own method, frozen test, result and interpretation.</text><rect x="20.0" y="80.0" width="565.0" height="28.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="80.0" width="5.0" height="28.0" rx="2.0" fill="#c9d6e4"/><text x="34.0" y="99.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 1</text><text x="118.0" y="99.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Problem, aim, research questions and the safety boundary</text><path d="M 302 108 L 302 113" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end="url(#ar)"/><rect x="20.0" y="114.0" width="565.0" height="28.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="114.0" width="5.0" height="28.0" rx="2.0" fill="#c9d6e4"/><text x="34.0" y="133.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 2</text><text x="118.0" y="133.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Five literature strands and the unresolved end-to-end gap</text><path d="M 302 142 L 302 147" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end=