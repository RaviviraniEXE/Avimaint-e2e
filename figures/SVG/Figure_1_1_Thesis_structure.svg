ar)"/><rect x="20.0" y="250.0" width="565.0" height="28.0" rx="4.0" fill="#f4f8fc" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="250.0" width="5.0" height="28.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="269.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 6</text><text x="118.0" y="269.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Four extraction architectures on one frozen 225-record test</text><text x="571.0" y="269.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">RQ2  RQ3</text><path d="M 302 278 L 302 283" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end="url(#ar)"/><rect x="20.0" y="284.0" width="565.0" height="28.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="284.0" width="5.0" height="28.0" rx="2.0" fill="#c9d6e4"/><text x="34.0" y="303.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 7</text><text x="118.0" y="303.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Silver knowledge graph and the source-linked case library</text><path d="M 302 312 L 302 317" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end="url(#ar)"/><rect x="20.0" y="318.0" width="565.0" height="28.0" rx="4.0" fill="#f4f8fc" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="318.0" width="5.0" height="28.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="337.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 8</text><text x="118.0" y="337.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Cluster-safe retrieval, calibration and the planning dashboard</text><text x="571.0" y="337.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">RQ4  RQ5</text><path d="M 302 346 L 302 351" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end="url(#ar)"/><rect x="20.0" y="352.0" width="565.0" height="28.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="352.0" width="5.0" height="28.0" rx="2.0" fill="#c9d6e4"/><text x="34.0" y="371.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 9</text><text x="118.0" y="371.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Consolidated answers, limitations and future evaluation</text><path d="M 302 380 L 302 385" fill="none" stroke="#4b5b6e" stroke-width="1.2" marker-end="url(#ar)"/><rect x="20.0" y="386.0" width="565.0" height="28.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="386.0" width="5.0" height="28.0" rx="2.0" fill="#c9d6e4"/><text x="34.0" y="405.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Chapter 10</text><text x="118.0" y="405.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">What the evidence does and does not establish</text><rect x="20.0" y="425.0" width="11.0" height="11.0" rx="2.0" fill="#2a78d6"/><text x="36.0" y="434.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">Chapters that answer a research question on a frozen test</text><line x1="20.0" y1="481.0" x2="585.0" y2="481.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="497.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Evidence never moves backwards: a result proven at one stage is not carried forward as</text><text x="20.0" y="514.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">proof for the next.</text></svg>