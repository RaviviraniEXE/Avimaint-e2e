<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="140.694mm" viewBox="0 0 605 532" role="img" aria-label="Figure 2.1 Literature strands and the evidence gap"><rect x="0" y="0" width="605" height="532" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Five literature strands and the gap this thesis addresses</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Each strand is mature on its own. None of them carries evidence from noisy text through to</text><text x="20.0" y="64.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">an auditable planning recommendation.</text><text x="212.0" y="100.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">What prior work establishes</text><text x="412.0" y="100.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">What it leaves open</text><rect x="20.0" y="112.0" width="565.0" height="46.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="112.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="133.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Maintenance language</text><text x="212.0" y="131.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Domain corpora and task</text><text x="212.0" y="147.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">benchmarks exist</text><text x="412.0" y="131.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">No end-to-end evidence</text><text x="412.0" y="147.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">pipeline</text><rect x="20.0" y="166.0" width="565.0" height="46.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="166.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="187.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Lexical normalization</text><text x="212.0" y="185.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Byte-level models beat</text><text x="212.0" y="201.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">dictionaries</text><text x="412.0" y="185.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Protected technical tokens</text><text x="412.0" y="201.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">rarely guarded</text><rect x="20.0" y="220.0" width="565.0" height="46.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="220.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="241.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Information extraction</text><text x="212.0" y="239.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Span-based joint models are</text><text x="212.0" y="255.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">mature</text><text x="412.0" y="239.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Rarely matched against a</text><text x="412.0" y="255.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">normalization choice</text><rect x="20.0" y="274.0" width="565.0" height="46.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="274.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="295.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Case-based retrieval</text><text x="212.0" y="293.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Similarity retrieval is well</text><text x="212.0" y="309.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">studied</text><text x="412.0" y="293.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Near-duplicate leakage</text><text x="412.0" y="309.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">seldom controlled</text><rect x="20.0" y="328.0" width="565.0" height="46.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="328.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="349.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Selective decision support</text><text x="212.0" y="347.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Abstention and calibration</text><text x="212.0" y="363.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">are formalised</text><text x="412.0" y="347.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Rarely applied to</text><text x="412.0" y="363.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">maintenance evidence</text><rect x="20.0" y="388.0" width="565.0" height="46.0" rx="4.0" fill="#eef5fb" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="388.0" width="5.0" height="46.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="408.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">The gap addressed here</text><text x="34.0" y="426.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">One pipeline in which normalization, extraction, leakage-safe retrieval and abstention are each measured on their own frozen population.</text><line x1="20.0" y1="489.0" x2="585.0" y2="489.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="505.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Chapter 2 reviews each strand against four criteria: data context, learning target,</text><text x="20.0" y="522.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">evidence design and operational interpretation.</text></svg>