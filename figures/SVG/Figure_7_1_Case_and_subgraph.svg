-weight="700" fill="#16314f">RECORDED ACTION  ·  family Replace  ·  outcome unknown</text><text x="34.0" y="451.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">REMOVED &amp; REPLACED GASKETS.</text><text x="34.0" y="466.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">The action side is hidden during retrieval and opened only after a case has been ranked.</text><line x1="20.0" y1="496.0" x2="585.0" y2="496.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="512.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">The graph supports inspection and an exploratory structured channel. It is not an input to</text><text x="20.0" y="529.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">the locked canonical-BM25 ranking, and a relation score is the model’s confidence in its</text><text x="20.0" y="546.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">own prediction, not evidence that the repair was correct.</text></svg>