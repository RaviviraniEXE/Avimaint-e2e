<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="135.934mm" viewBox="0 0 605 514" role="img" aria-label="Figure 8.4 Eligible-evidence gate and abstention"><rect x="0" y="0" width="605" height="514" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">How an option becomes eligible, and when the system abstains</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Schematic of the display rule. The prior-tempering exponent orders candidates; it is not a</text><text x="20.0" y="64.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">score threshold.</text><rect x="20.0" y="102.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="102.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="120.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Canonical BM25 returns ranked cases</text><text x="34.0" y="137.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">from allowed partitions, query cluster excluded</text><path d="M 302 145 L 302 156" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="158.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="158.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="176.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Cluster expansion</text><text x="34.0" y="193.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">all training members of each retrieved cluster are reopened</text><path d="M 302 201 L 302 212" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="214.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="214.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="232.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">One vote per cluster per family</text><text x="34.0" y="249.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">prevents a repeated record from manufacturing support</text><path d="M 302 257 L 302 268" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="270.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="270.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="288.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Prior-tempered ranking key</text><text x="34.0" y="305.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">distinct support divided by the training prior raised to τ_rank = 0.15</text><path d="M 302 313 L 302 324" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="326.0" width="282.0" height="86.0" rx="4.0" fill="#f2faf6" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="326.0" width="5.0" height="86.0" rx="2.0" fill="#1baf7a"/><text x="34.0" y="348.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#1baf7a">Eligible pattern exists</text><text x="34.0" y="370.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Display the option with its</text><text x="34.0" y="388.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">evidence, outcome and provenance.</text><rect x="323.0" y="326.0" width="262.0" height="86.0" rx="4.0" fill="#fdf2ec" stroke="#c9d6e4" stroke-width="1.0"/><rect x="323.0" y="326.0" width="5.0" height="86.0" rx="2.0" fill="#eb6834"/><text x="337.0" y="348.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#eb6834">No eligible pattern</text><text x="337.0" y="370.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Abstain. Show the nearest cases</text><text x="337.0" y="388.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">and ask for more information.</text><line x1="20.0" y1="471.0" x2="585.0" y2="471.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="487.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Explicitly negative, mixed and unresolved outcomes remain reviewable but are never promoted</text><text x="20.0" y="504.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">as positive evidence. Abstention is an output, not a failure.</text></svg>