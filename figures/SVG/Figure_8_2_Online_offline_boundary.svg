<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="115.835mm" viewBox="0 0 605 438" role="img" aria-label="Figure 8.2 Offline evidence and online query paths"><rect x="0" y="0" width="605" height="438" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Offline historical structure and the two separate query paths</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Architecture schematic. The hosted dashboard and the locked RQ4 evaluation do not use the</text><text x="20.0" y="64.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">same query path.</text><rect x="20.0" y="102.0" width="565.0" height="56.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="102.0" width="5.0" height="56.0" rx="2.0" fill="#7b8a99"/><text x="34.0" y="124.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">OFFLINE  ·  computed once over 6,169 records</text><text x="34.0" y="144.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Selective ByT5 normalization, SpERT spans and relations, silver graph, source-linked case library</text><path d="M 302 158 L 302 178" fill="none" stroke="#4b5b6e" stroke-width="1.4" marker-end="url(#ar)"/><line x1="20.0" y1="180.0" x2="585.0" y2="180.0" stroke="#2a78d6" stroke-width="1.4"/><text x="20.0" y="198.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">TWO QUERY PATHS</text><rect x="20.0" y="210.0" width="282.0" height="124.0" rx="4.0" fill="#eef5fb" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="210.0" width="5.0" height="124.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="232.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">Locked RQ4 evaluation</text><text x="34.0" y="254.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">828 precomputed test queries</text><text x="34.0" y="274.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Canonical BM25 over the</text><text x="34.0" y="292.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">normalized problem key</text><text x="34.0" y="316.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Graph features excluded from the score</text><rect x="323.0" y="210.0" width="262.0" height="124.0" rx="4.0" fill="#f2faf6" stroke="#c9d6e4" stroke-width="1.0"/><rect x="323.0" y="210.0" width="5.0" height="124.0" rx="2.0" fill="#1baf7a"/><text x="337.0" y="232.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#1baf7a">Hosted dashboard, new problem</text><text x="337.0" y="254.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Typed by a planner at runtime</text><text x="337.0" y="274.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Protected rules build the same</text><text x="337.0" y="292.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">canonical key; no live neural model</text><text x="337.0" y="316.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">RQ4 scores do not transfer to this path</text><line x1="20.0" y1="395.0" x2="585.0" y2="395.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="411.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">The dashboard consumes precomputed ByT5 and SpERT output; it does not run either model at</text><text x="20.0" y="428.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">request time. Test metrics describe the locked evaluation path only.</text></svg>