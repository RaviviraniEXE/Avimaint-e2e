ans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">667</text><text x="20.0" y="277.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">ACTION_RESULTS_IN_OUTCOME</text><rect x="250.0" y="266.0" width="48.0" height="14.0" rx="2.0" fill="#2a78d6"/><text x="304.0" y="277.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">533</text><text x="20.0" y="303.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">OCCURS_UNDER_CONTEXT</text><rect x="250.0" y="292.0" width="35.2" height="14.0" rx="2.0" fill="#2a78d6"/><text x="291.2" y="303.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">391</text><text x="20.0" y="329.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">ACTION_FOLLOWS_REFERENCE</text><rect x="250.0" y="318.0" width="6.3" height="14.0" rx="2.0" fill="#eb6834"/><text x="262.3" y="329.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">70</text><text x="20.0" y="355.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">ACTION_USES_ITEM</text><rect x="250.0" y="344.0" width="5.6" height="14.0" rx="2.0" fill="#eb6834"/><text x="261.6" y="355.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">62</text><rect x="20.0" y="420.0" width="10.0" height="10.0" rx="2.0" fill="#2a78d6"/><text x="35.0" y="428.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">300 instances or more</text><rect x="190.2" y="420.0" width="10.0" height="10.0" rx="2.0" fill="#eb6834"/><text x="205.2" y="428.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="600" fill="#1d2b3a">Fewer than 300 instances</text><line x1="20.0" y1="465.0" x2="585.0" y2="465.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="481.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Two relation types fall below 100 instances in the whole corpus. Their frozen-test support</text><text x="20.0" y="498.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">is only two and ten cases, so the per-class scores in Table B.2 are statistically fragile.</text></svg>