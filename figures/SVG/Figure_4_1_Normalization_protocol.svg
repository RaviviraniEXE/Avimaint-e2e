<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="128.529mm" viewBox="0 0 605 486" role="img" aria-label="Figure 4.1 Cluster-safe normalization protocol"><rect x="0" y="0" width="605" height="486" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Cluster-safe normalization experiment and the one-way test gate</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">The locked test is opened once, after the system has already been chosen on validation</text><text x="20.0" y="64.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">data.</text><rect x="20.0" y="102.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="102.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="120.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">5,124 paired records</text><text x="34.0" y="137.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">problem text with an expert-cleaned reference</text><path d="M 302 145 L 302 156" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="158.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="158.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="176.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">1,840 similarity clusters</text><text x="34.0" y="193.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">near-duplicates grouped before any split</text><path d="M 302 201 L 302 212" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="214.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="214.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="232.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Seed-42 split</text><text x="34.0" y="249.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">3,457 train  ·  926 validation  ·  741 locked test</text><path d="M 302 257 L 302 268" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="270.0" width="565.0" height="42.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="270.0" width="5.0" height="42.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="288.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Six representations trained</text><text x="34.0" y="305.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">raw, most-frequent, rules, ByT5, Selective ByT5, rules then ByT5</text><path d="M 302 313 L 302 324" fill="none" stroke="#4b5b6e" stroke-width="1.3" marker-end="url(#ar)"/><rect x="20.0" y="326.0" width="286.0" height="60.0" rx="4.0" fill="#eef5fb" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="326.0" width="5.0" height="60.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="346.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">Validation, 926 records</text><text x="34.0" y="364.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Selects one official system.</text><text x="34.0" y="380.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">May be inspected freely.</text><rect x="318.0" y="326.0" width="267.0" height="60.0" rx="4.0" fill="#fdf2ec" stroke="#c9d6e4" stroke-width="1.0"/><rect x="318.0" y="326.0" width="5.0" height="60.0" rx="2.0" fill="#eb6834"/><text x="332.0" y="346.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#eb6834">Locked test, 741 records</text><text x="332.0" y="364.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Scored once, after selection.</text><text x="332.0" y="380.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">No retraining or retuning afterwards.</text><path d="M 308 356 L 316 356" fill="none" stroke="#4b5b6e" stroke-width="1.5" marker-end="url(#ar)"/><line x1="20.0" y1="443.0" x2="585.0" y2="443.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="459.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Selective ByT5 was chosen on validation and carried unchanged to the locked test, where</text><text x="20.0" y="476.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">pure ByT5 turned out to have the lower word error rate. The selection was not revised.</text></svg>