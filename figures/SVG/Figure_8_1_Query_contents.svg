<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="89.388mm" viewBox="0 0 605 338" role="img" aria-label="Figure 8.1 What a retrieval query carries"><rect x="0" y="0" width="605" height="338" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">What the retrieval query carries, and what is withheld</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Schematic of the frozen RQ4 protocol. This is not a capture of the deployed interface.</text><rect x="20.0" y="84.0" width="282.0" height="150.0" rx="4.0" fill="#eef5fb" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="84.0" width="5.0" height="150.0" rx="2.0" fill="#2a78d6"/><text x="34.0" y="106.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#2a78d6">ENTERS THE QUERY</text><text x="34.0" y="132.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  Normalized problem text (canonical key)</text><text x="34.0" y="156.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  Optional planner-entered context</text><text x="34.0" y="180.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  Allowed historical partitions only</text><text x="34.0" y="216.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Ranked by canonical BM25.</text><rect x="323.0" y="84.0" width="262.0" height="150.0" rx="4.0" fill="#fdf2ec" stroke="#c9d6e4" stroke-width="1.0"/><rect x="323.0" y="84.0" width="5.0" height="150.0" rx="2.0" fill="#eb6834"/><text x="337.0" y="106.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#eb6834">WITHHELD FROM THE QUERY</text><text x="337.0" y="132.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  The record&#x27;s own recorded action</text><text x="337.0" y="156.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  Every case in the same evidence cluster</text><text x="337.0" y="180.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">•  Silver graph features and live extraction</text><text x="337.0" y="216.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Opened only after ranking.</text><line x1="20.0" y1="295.0" x2="585.0" y2="295.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="311.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Withholding the action side is what makes the retrieval score a measure of recovering</text><text x="20.0" y="328.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">evidence rather than of recognising the answer it was given.</text></svg>