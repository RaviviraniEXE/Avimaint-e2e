<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="133.818mm" viewBox="0 0 605 506" role="img" aria-label="Figure 3.1 Evidence layers and permitted claims"><rect x="0" y="0" width="605" height="506" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5b6e"/></marker></defs><text x="20.0" y="26.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Five evidence layers and what each one is allowed to prove</text><text x="20.0" y="46.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Colour marks the authority of the evidence. Populations overlap by derivation, so their</text><text x="20.0" y="64.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">denominators are never pooled.</text><rect x="20.0" y="98.0" width="565.0" height="54.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="98.0" width="5.0" height="54.0" rx="2.0" fill="#1baf7a"/><text x="36.0" y="118.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Historical corpus</text><text x="36.0" y="138.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">6,169 problem-action records</text><rect x="488.1" y="106.0" width="80.9" height="18.0" rx="9.0" fill="#1baf7a"/><text x="528.5" y="119.0" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#ffffff">OBSERVED</text><text x="569.0" y="140.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Describes what was written, not what was correct.</text><rect x="20.0" y="160.0" width="565.0" height="54.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="160.0" width="5.0" height="54.0" rx="2.0" fill="#b8860b"/><text x="36.0" y="180.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Normalization reference</text><text x="36.0" y="200.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">5,124 paired records (3,457 / 926 / 741)</text><rect x="504.3" y="168.0" width="64.7" height="18.0" rx="9.0" fill="#b8860b"/><text x="536.6" y="181.0" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#ffffff">EXPERT</text><text x="569.0" y="202.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Supports RQ1 agreement claims on the locked test only.</text><rect x="20.0" y="222.0" width="565.0" height="54.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="222.0" width="5.0" height="54.0" rx="2.0" fill="#b8860b"/><text x="36.0" y="242.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Information-extraction corpus</text><text x="36.0" y="262.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">1,600 manually corrected records</text><rect x="520.5" y="230.0" width="48.5" height="18.0" rx="9.0" fill="#b8860b"/><text x="544.8" y="243.0" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#ffffff">GOLD</text><text x="569.0" y="264.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Supports RQ2 and RQ3 on the frozen 225-record test.</text><rect x="20.0" y="284.0" width="565.0" height="54.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="284.0" width="5.0" height="54.0" rx="2.0" fill="#7b8a99"/><text x="36.0" y="304.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Full-corpus extraction and graph</text><text x="36.0" y="324.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">6,169 records, 3,197 typed nodes</text><rect x="504.3" y="292.0" width="64.7" height="18.0" rx="9.0" fill="#7b8a99"/><text x="536.6" y="305.0" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#ffffff">SILVER</text><text x="569.0" y="326.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Model output. Supports exploration, never a benchmark claim.</text><rect x="20.0" y="346.0" width="565.0" height="54.0" rx="4.0" fill="#fbfcfe" stroke="#c9d6e4" stroke-width="1.0"/><rect x="20.0" y="346.0" width="5.0" height="54.0" rx="2.0" fill="#2a78d6"/><text x="36.0" y="366.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#16314f">Retrieval and human review</text><text x="36.0" y="386.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">828 test queries, 100 reviewed</text><rect x="512.4" y="354.0" width="56.6" height="18.0" rx="9.0" fill="#2a78d6"/><text x="540.7" y="367.0" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="700" fill="#ffffff">MIXED</text><text x="569.0" y="388.0" text-anchor="end" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#1d2b3a">Frozen agreement with recorded actions; one reviewer only.</text><line x1="20.0" y1="463.0" x2="585.0" y2="463.0" stroke="#c9d6e4" stroke-width="1.0"/><text x="20.0" y="479.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Expert and gold layers support direct benchmark claims on their own frozen population.</text><text x="20.0" y="496.0" font-family="Calibri, Carlito, sans-serif" font-size="10pt" font-weight="400" fill="#4b5b6e">Silver layers are model output and are reported as such everywhere they appear.</text></svg>