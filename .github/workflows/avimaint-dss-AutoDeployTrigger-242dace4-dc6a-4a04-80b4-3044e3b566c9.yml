name: Trigger auto deployment for avimaint-dss

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/avimaint-dss-AutoDeployTrigger-242dace4-dc6a-4a04-80b4-3044e3b566c9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AVIMAINTDSS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AVIMAINTDSS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AVIMAINTDSS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/dashboard
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: caecf70177c3acr.azurecr.io
          registryUsername: ${{ secrets.AVIMAINTDSS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AVIMAINTDSS_REGISTRY_PASSWORD }}
          containerAppName: avimaint-dss
          resourceGroup: avimaint-dss-rg
          imageToBuild: caecf70177c3acr.azurecr.io/avimaint-dss:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


