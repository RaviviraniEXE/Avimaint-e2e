name: Validate and deploy AviMaint dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avimaint-dashboard-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frozen dashboard release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dashboard/backend/requirements.txt
            dashboard/backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install backend test dependencies
        working-directory: dashboard
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run backend regression tests
        working-directory: dashboard/backend
        run: python -m pytest tests -q

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: dashboard/frontend
        run: npm run check

      - name: Verify frozen artifacts and production bundles
        working-directory: dashboard
        run: python scripts/verify_release.py --require-frontend

      - name: Build production Docker image
        run: docker build --tag "avimaint-dss:${GITHUB_SHA}" dashboard

      - name: Start production container
        run: >-
          docker run --detach
          --name avimaint-dss-ci
          --publish 7860:7860
          "avimaint-dss:${GITHUB_SHA}"

      - name: Smoke-test health endpoint
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:7860/api/v1/health > health.json; then
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload["status"] == "ready", payload
          assert payload["api_version"] == "8.3.2", payload
          print(json.dumps(payload, indent=2))
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs avimaint-dss-ci
          exit 1

      - name: Stop validation container
        if: always()
        run: docker rm --force avimaint-dss-ci || true

  deploy:
    name: Deploy validated image to Azure Container Apps
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      APP_URL: https://avimaint-dss.icytree-faca4fb6.francecentral.azurecontainerapps.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AVIMAINTDSS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AVIMAINTDSS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AVIMAINTDSS_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy dashboard
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/dashboard
          dockerfilePath: Dockerfile
          registryUrl: caecf70177c3acr.azurecr.io
          registryUsername: ${{ secrets.AVIMAINTDSS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AVIMAINTDSS_REGISTRY_PASSWORD }}
          containerAppName: avimaint-dss
          containerAppEnvironment: avimaint-dss-env-frc
          resourceGroup: avimaint-dss-rg
          imageToBuild: caecf70177c3acr.azurecr.io/avimaint-dss:${{ github.sha }}
          targetPort: 7860
          ingress: external
          location: francecentral

      - name: Verify the deployed API and frontend
        shell: bash
        run: |
          rm -f health.json index.html

          for attempt in {1..36}; do
            if curl --fail --silent --show-error               --connect-timeout 10 --max-time 30               "${APP_URL}/api/v1/health" > health.json; then
              break
            fi
            sleep 5
          done

          test -s health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload["status"] == "ready", payload
          assert payload["api_version"] == "8.3.2", payload
          assert payload["frontend"]["ready"] is True, payload
          print("Azure health check passed:", payload["api_version"])
          PY

          curl --fail --silent --show-error             --connect-timeout 10 --max-time 30             "${APP_URL}/" > index.html
          grep --quiet '<div id="root"></div>' index.html
