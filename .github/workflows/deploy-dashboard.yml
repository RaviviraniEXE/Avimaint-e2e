name: Validate and deploy AviMaint dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avimaint-dashboard-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frozen dashboard release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dashboard/backend/requirements.txt
            dashboard/backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install backend test dependencies
        working-directory: dashboard
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run backend regression tests
        working-directory: dashboard/backend
        run: python -m pytest tests -q

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: dashboard/frontend
        run: npm run check

      - name: Verify frozen artifacts and production bundles
        working-directory: dashboard
        run: python scripts/verify_release.py --require-frontend

      - name: Build production Docker image
        run: docker build --tag "avimaint-dss:${GITHUB_SHA}" dashboard

      - name: Start production container
        run: >-
          docker run --detach
          --name avimaint-dss-ci
          --publish 7860:7860
          "avimaint-dss:${GITHUB_SHA}"

      - name: Smoke-test health endpoint
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:7860/api/v1/health > health.json; then
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload["status"] == "ready", payload
          assert payload["api_version"] == "8.3.2", payload
          print(json.dumps(payload, indent=2))
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs avimaint-dss-ci
          exit 1

      - name: Stop validation container
        if: always()
        run: docker rm --force avimaint-dss-ci || true

  deploy:
    name: Deploy dashboard directory to Hugging Face
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check --upgrade huggingface_hub

      - name: Validate deployment configuration
        shell: bash
        env:
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_SPACE_REPO_ID" || "$HF_SPACE_REPO_ID" != */* ]]; then
            echo "HF_SPACE_REPO_ID must be set to owner/space-name."
            exit 1
          fi
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Synchronize clean dashboard source to Space root
        env:
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload "$HF_SPACE_REPO_ID"
          ./dashboard .
          --repo-type=space
          --token="$HF_TOKEN"
          --delete="*"
          --exclude="frontend/node_modules/**"
          --exclude="frontend/dist/**"
          --exclude="backend/.venv/**"
          --exclude=".test-venv/**"
          --exclude="**/.pytest_cache/**"
          --exclude="**/__pycache__/**"
          --exclude="**/*.pyc"
          --exclude="**/*.tsbuildinfo"
          --exclude="models/byt5/**"
          --exclude="models/selective_spert/final_model/**"
          --commit-message="Deploy AviMaint-DSS 8.3.2 from GitHub ${GITHUB_SHA}"
